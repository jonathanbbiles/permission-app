# Permission — Codemagic cloud build → TestFlight (Capacitor iOS)
# Same proven pipeline as ChordLoop. Automatic signing via an App Store Connect API key.
workflows:
  ios-testflight:
    name: Permission iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # --- Auto-build on push to main -----------------------------------------
    # A push to main starts this workflow automatically: no browser, no "Start
    # build" click. See PLAYBOOK.md "Shipping without the browser".
    # ONE-TIME per app in the Codemagic UI: the repo needs a webhook registered
    # (app -> Settings -> Webhooks -> "Add webhook"). Apps configured via
    # codemagic.yaml, or connected over SSH/HTTPS rather than the GitHub App, do
    # NOT get one automatically -- without it this block is inert and nothing
    # breaks, builds just never self-start.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # A newer push supersedes an in-flight build of the same branch.
      cancel_previous_builds: true
    integrations:
      app_store_connect: ChordLoopAPIKey   # reusing your existing account-wide App Store Connect API key
    environment:
      ios_signing:
        provisioning_profiles:
          - Permission_AppStore_SharedDist
        certificates:
          - JB_Shared_Distribution
      vars:
        BUNDLE_ID: "com.jonathanbiles.permission"
        XCODE_PROJECT: "ios/App/App.xcodeproj"     # SPM project (no .xcworkspace) — same as ChordLoop
        XCODE_SCHEME: "App"
        APP_APPLE_ID: "6789405787"     # <-- after you create the app record in App Store Connect, paste its Apple ID (the number) here so build numbers auto-increment
      node: 22               # Capacitor CLI needs Node 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add + sync iOS platform (Capacitor)
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Verify speech-to-text stays REMOVED, and list what actually compiled
        script: |
          # ---------------------------------------------------------------
          # 1.4.0 REMOVED speech-to-text entirely (the Dictate button, the
          # transcript panel, the file-based transcriber and our own
          # native/permission-speech SPM plugin). It had been broken or
          # crashing for the whole 1.3.x train and is not wanted.
          #
          # This step used to REQUIRE the plugin. It now REQUIRES ITS ABSENCE,
          # so the feature cannot creep back in unnoticed via a stray npm
          # install or a revived import.
          # ---------------------------------------------------------------
          SPM=ios/App/CapApp-SPM/Package.swift
          [ -f "$SPM" ] || { echo "BLOCKED: $SPM not found — cap add/sync did not run?"; exit 1; }
          echo "----- generated SPM manifest -----"; cat "$SPM"
          if grep -q "PermissionSpeech" "$SPM"; then
            echo "BLOCKED: PermissionSpeech is back in $SPM. Speech-to-text was removed in 1.4.0."
            exit 1
          fi
          [ -d native/permission-speech ] && { echo "BLOCKED: native/permission-speech is back."; exit 1; }
          if grep -qE "SpeechRecognition|PermissionSpeech|transcribeFile|id=\"vDictate\"" www/index.html; then
            echo "BLOCKED: www/index.html still references speech-to-text."
            grep -nE "SpeechRecognition|PermissionSpeech|transcribeFile|id=\"vDictate\"" www/index.html
            exit 1
          fi
          echo "OK — no speech recogniser anywhere in the build."

          # RECORDING still has to work. capacitor-voice-recorder is knowingly
          # SPM-incompatible and excluded (recording runs on the WKWebView
          # MediaRecorder path), so this is a log statement, not a gate — but
          # the recorder UI must exist.
          grep -q 'id="recBtn"' www/index.html || { echo "BLOCKED: the record button is gone — recording must keep working."; exit 1; }
          echo "OK — the voice recorder UI is intact."
          echo ""
          echo "----- plugins Capacitor found vs. plugins actually compiled -----"
          npx cap ls ios 2>&1 | sed 's/^/  /' || true
          echo "  (only packages listed as .package(...) in the manifest above are in the IPA)"
      - name: Generate app icon + splash, and PROVE the real icon landed
        script: |
          # appicon-1024.png at the repo root is the single source of truth for
          # the app icon (1024x1024, no alpha — Apple rejects alpha here).
          # Feed it to @capacitor/assets so the generator writes the whole
          # AppIcon.appiconset (and its Contents.json) from it.
          set -e
          [ -f appicon-1024.png ] || { echo "BLOCKED: appicon-1024.png missing at repo root"; exit 1; }
          mkdir -p assets
          cp appicon-1024.png assets/icon.png
          npx @capacitor/assets generate --ios || echo "asset generation warning (continuing to the check below)"

          # `ios/` is regenerated every build, so a failed generation silently
          # leaves Capacitor's PLACEHOLDER icon in place — which is an automatic
          # rejection. Never trust the generator; verify a real 1024 icon is in
          # the appiconset and fail the build if it is not.
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          [ -d "$ICONSET" ] || { echo "BLOCKED: $ICONSET does not exist"; exit 1; }
          FOUND=""
          for f in "$ICONSET"/*.png; do
            [ -f "$f" ] || continue
            W=$(sips -g pixelWidth "$f" 2>/dev/null | awk '/pixelWidth/{print $2}')
            if [ "$W" = "1024" ]; then FOUND="$f"; break; fi
          done
          [ -n "$FOUND" ] || { echo "BLOCKED: no 1024x1024 icon in $ICONSET — the Capacitor placeholder would ship"; ls -la "$ICONSET"; exit 1; }
          # It must be OUR icon, not a same-sized placeholder.
          if cmp -s "$FOUND" appicon-1024.png; then
            echo "OK — $FOUND is byte-identical to appicon-1024.png"
          else
            echo "OK — $FOUND is 1024x1024 (re-encoded by the generator); checking it is not the Capacitor placeholder"
            SZ=$(wc -c < "$FOUND")
            [ "$SZ" -gt 20000 ] || { echo "BLOCKED: $FOUND is only ${SZ}B — that is a placeholder, not the real artwork"; exit 1; }
          fi
          echo "----- AppIcon.appiconset -----"; ls -la "$ICONSET"
      - name: Info.plist — display name, permission strings, export compliance
        script: |
          # ---------------------------------------------------------------
          # Guideline 2.1 — iOS hard-CRASHES (SIGABRT, not a denied prompt)
          # the instant an app touches a protected API with no matching
          # NS*UsageDescription. `ios/` is regenerated by `npx cap add ios`
          # on every build and Capacitor's template carries NO usage keys at
          # all, so every string must be re-applied here, every time.
          #
          # What triggers each key in www/index.html:
          #   Microphone        — voice recording (speech recognition removed in 1.4.0)
          #   Camera            — <input accept="video/*"> "Record Video" (v1.3)
          #   Photo library     — same input's "Photo Library" source (v1.3)
          #   Face ID           — passcode-free unlock
          # ---------------------------------------------------------------
          P=ios/App/App/Info.plist
          set +e
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Permission" "$P" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Permission" "$P"
          MIC="Permission uses the microphone only to record your voice and video journal entries. Recordings are saved privately on your device and are never uploaded."
          CAM="Permission uses the camera only so you can record a video journal entry for yourself. Videos are kept inside the app on your device, are never added to your Photos library, and are never uploaded."
          PHO="Permission asks for your photo library only if you choose an existing video for a journal entry. Nothing is uploaded, and the app never reads your library on its own."
          FID="Permission uses Face ID so only you can unlock your journal. Your data never leaves your phone."
          setkey(){ /usr/libexec/PlistBuddy -c "Add :$1 string \"$2\"" "$P" || /usr/libexec/PlistBuddy -c "Set :$1 \"$2\"" "$P"; }
          setkey NSMicrophoneUsageDescription       "$MIC"
          setkey NSCameraUsageDescription           "$CAM"
          setkey NSPhotoLibraryUsageDescription     "$PHO"
          setkey NSFaceIDUsageDescription           "$FID"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$P"

          # Print each key BACK so the build log proves it landed, and fail the
          # build if any is missing — a missing string is a shipped crash.
          set -e
          echo "----- usage descriptions (printed back from the plist) -----"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription"        "$P"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription"            "$P"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription"      "$P"
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription"            "$P"
          MISSING=0
          for K in NSMicrophoneUsageDescription \
                   NSCameraUsageDescription NSPhotoLibraryUsageDescription \
                   NSFaceIDUsageDescription; do
            V=$(/usr/libexec/PlistBuddy -c "Print :$K" "$P" 2>/dev/null) || V=""
            if [ -z "$V" ]; then echo "MISSING  $K"; MISSING=1; fi
          done
          [ "$MISSING" -eq 0 ] || { echo "BLOCKED: a required usage string is missing — this build would crash on device."; exit 1; }

          # ---------------------------------------------------------------
          # SPEECH RECOGNITION IS GONE (1.4.0). The app no longer touches
          # SFSpeechRecognizer, so asking for the permission would be asking
          # for something it never uses — the kind of thing App Review asks
          # about. Strip the key if a stale plist template carries it, and
          # fail if it somehow survives.
          # ---------------------------------------------------------------
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$P" 2>/dev/null || true
          if /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$P" >/dev/null 2>&1; then
            echo "BLOCKED: NSSpeechRecognitionUsageDescription is still present — speech-to-text was removed in 1.4.0."
            exit 1
          fi
          echo "OK       NSSpeechRecognitionUsageDescription absent — the app cannot use speech recognition"

          # ---------------------------------------------------------------
          # RECORDINGS STAY IN THE APP.
          # NSPhotoLibraryAddUsageDescription must NEVER be present. Without
          # it iOS refuses to let the app add anything to the photo library at
          # all — so "voice and video entries are never saved to Photos" is
          # enforced by the OS, not just by our code. Adding this key would
          # silently grant that ability, so the build fails if it appears.
          # (NSPhotoLibraryUsageDescription — READ — is fine and intended: it
          # only lets the user pick an existing video to bring INTO the app.)
          # ---------------------------------------------------------------
          if /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$P" >/dev/null 2>&1; then
            echo "BLOCKED: NSPhotoLibraryAddUsageDescription is present."
            echo "Permission must never be able to write to the photo library — recordings stay in the app."
            exit 1
          fi
          echo "OK       NSPhotoLibraryAddUsageDescription absent — the app CANNOT write to Photos"
          echo "----- Info.plist -----"; cat "$P"
      - name: Enable iOS audio session (record + playback of voice notes)
        script: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("ios/App/App/AppDelegate.swift")
          s = p.read_text()
          if "import AVFoundation" not in s:
              s = s.replace("import Capacitor", "import Capacitor\nimport AVFoundation", 1)
          if "setCategory(.playAndRecord" not in s and "didFinishLaunchingWithOptions" in s:
              i = s.index("didFinishLaunchingWithOptions"); b = s.index("{", i)
              inject = '\n        do { try AVAudioSession.sharedInstance().setCategory(.playAndRecord, mode: .default, options: [.defaultToSpeaker, .allowBluetooth]); try AVAudioSession.sharedInstance().setActive(true) } catch { print("Audio session error: \\(error)") }'
              s = s[:b+1] + inject + s[b+1:]
          p.write_text(s); print(s)
          PY
      - name: Set a unique build number
        script: |
          # CFBundleVersion must be a monotonically increasing integer, higher than any prior build.
          # Use a unix timestamp: always an integer, always increasing, immune to float app versions like 1.0.
          NEXT=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" ios/App/App/Info.plist
          # 1.4.0 — speech-to-text/Dictate removed entirely; home screen is now a
          # balanced 2x2 of Write / Record / Draw / Notebook.
          # 1.3.6 is a separate version in App Store Connect and is NOT touched
          # by this build: this lane publishes to TestFlight only (see the
          # review-submit toggle at the bottom, deliberately commented out).
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.4.0" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.4.0" ios/App/App/Info.plist
          echo "CFBundleVersion = $NEXT (timestamp-based, always increasing); CFBundleShortVersionString=1.4.0"
      - name: Set up code signing — apply the stored profile + the ONE shared cert (no mint, no revoke)
        script: |
          security find-identity -v -p codesigning || true
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

        # --- REVIEW-SUBMIT TOGGLE — deliberately OFF ---------------------------
        # As written, every green build goes to TestFlight and stops there.
        # Uncommenting submit_to_app_store makes EVERY subsequent green build
        # submit itself for App Store review, so flip it on with intent and flip
        # it back off after the release.
        # Prerequisites in App Store Connect, or the submit step fails the build:
        #   - screenshots for every required device size
        #   - description, keywords, promotional text, support + marketing URLs
        #   - privacy policy URL and the App Privacy answers
        #   - age rating, category, and export-compliance answers
        #   - a "What's New" note for this version string
        # See PLAYBOOK.md "Submitting for review without the browser".
        # submit_to_app_store: true
        # release_type: MANUAL      # MANUAL | AFTER_APPROVAL | SCHEDULED
